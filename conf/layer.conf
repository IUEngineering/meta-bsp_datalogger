# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsp_datalogger"
BBFILE_PATTERN_meta-bsp_datalogger = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsp_datalogger = "6"

LAYERDEPENDS_meta-bsp_datalogger = "core"
LAYERSERIES_COMPAT_meta-bsp_datalogger = "scarthgap"
