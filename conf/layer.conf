# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"
MACHINE ??= 'imx6ull-datalogger'

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-bsp_datalogger"
BBFILE_PATTERN_meta-bsp_datalogger = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-bsp_datalogger = "10"

LAYERDEPENDS_meta-bsp_datalogger = "core"
LAYERSERIES_COMPAT_meta-bsp_datalogger = "scarthgap"

#very important for SDMA drivers
CORE_IMAGE_EXTRA_INSTALL += "firmware-imx-sdma-imx6q" 

CORE_IMAGE_EXTRA_INSTALL += "i2c-tools"
CORE_IMAGE_EXTRA_INSTALL += "alsa-utils"
CORE_IMAGE_EXTRA_INSTALL += "nano"
CORE_IMAGE_EXTRA_INSTALL += "kernel-modules"
CORE_IMAGE_EXTRA_INSTALL += "rsync"
CORE_IMAGE_EXTRA_INSTALL += "wvdial"
CORE_IMAGE_EXTRA_INSTALL += "usbutils"

# Thommy additions:
CORE_IMAGE_EXTRA_INSTALL += "htop"
CORE_IMAGE_EXTRA_INSTALL += "stress-ng"
# Bart-Jan additions:
CORE_IMAGE_EXTRA_INSTALL += "screen"
CORE_IMAGE_EXTRA_INSTALL += "curl"
CORE_IMAGE_EXTRA_INSTALL += "iperf3"
CORE_IMAGE_EXTRA_INSTALL += "git"
CORE_IMAGE_EXTRA_INSTALL += "net-tools"
CORE_IMAGE_EXTRA_INSTALL += "nftables"
# JDB additions:
CORE_IMAGE_EXTRA_INSTALL += "gpsd"
CORE_IMAGE_EXTRA_INSTALL += "minicom"
CORE_IMAGE_EXTRA_INSTALL += "netcat"
CORE_IMAGE_EXTRA_INSTALL += "tcpdump"
# Modem
CORE_IMAGE_EXTRA_INSTALL += "ppp"
KERNEL_CONFIG_FRAGMENTS += "ppp.cfg"

# Set hostname
hostname_pn-base-files = "dlogger_rev2.11"